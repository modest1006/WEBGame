<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#bde9ff">
  <title>ことばのわ</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <canvas id="effects" aria-hidden="true"></canvas>
  <main id="app" class="theme-title">
    <section id="title-screen" class="screen title-screen">
      <div class="logo-bubble" aria-label="ことばのわ">
        <div class="logo-ring">🐶 <span>🌸</span> 🚗</div>
        <h1>ことばのわ</h1>
        <p>えを タップして つながろう！</p>
      </div>
      <div class="mode-buttons">
        <button class="mode-button walk" data-mode="walk"><span class="mode-icon">🐾</span><span>さんぽ</span><small>すきな ことばへ</small></button>
        <button class="mode-button quest" data-mode="quest"><span class="mode-icon">🎯</span><span>めざせ</span><small>ゴールを さがそう</small></button>
        <button class="mode-button quiz" data-mode="quiz"><span class="mode-icon">❓</span><span>だれかな</span><small>つながり クイズ</small></button>
      </div>
    </section>

    <section id="game-screen" class="screen game-screen hidden">
      <header class="game-header">
        <button id="back-button" class="corner-button" aria-label="タイトルにもどる">⌂</button>
        <button id="target-card" class="target-card hidden" aria-label="もくひょうをよむ">
          <span class="target-caption">ここへ いこう！</span>
          <span id="target-emoji"></span>
          <span id="target-label"></span>
        </button>
        <div id="mode-badge" class="mode-badge"></div>
        <button id="mute-button" class="corner-button" aria-label="おとをけす">🔊</button>
      </header>

      <div id="message" class="message" aria-live="polite"></div>
      <div id="word-stage" class="word-stage">
        <svg id="links" class="links" aria-hidden="true"></svg>
        <div id="neighbors" class="neighbors"></div>
        <button id="center-word" class="word-node center-node" aria-label="いまのことば">
          <span class="word-emoji"></span>
          <span class="word-label"></span>
        </button>
      </div>

      <div id="quiz-choices" class="quiz-choices hidden"></div>
      <button id="random-button" class="random-button hidden" aria-label="ランダムなことばへ">🎲</button>
    </section>
  </main>
  <div id="debug-overlay" class="debug-overlay hidden"></div>

  <script src="js/words.js?v=16"></script>
  <script src="js/icons.js?v=16"></script>
  <script src="js/audio.js?v=16"></script>
  <script src="js/game.js?v=16"></script>
  <script src="js/renderer.js?v=16"></script>
  <script src="js/input.js?v=16"></script>
  <script src="js/debug.js?v=16"></script>
  <script src="js/main.js?v=16"></script>
</body>
</html>
